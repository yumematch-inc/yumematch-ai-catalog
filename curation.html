<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カタログ精査シート｜YUMEMATCH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
.hdr{background:#1e1b4b;color:#fff;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.hdr-ttl{font-size:16px;font-weight:800;letter-spacing:-.03em}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.hdr-right{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.counter{background:rgba(255,255,255,.12);border-radius:8px;padding:6px 14px;font-size:12px;display:flex;gap:12px}
.cnt-item{text-align:center}
.cnt-num{font-size:18px;font-weight:900;line-height:1}
.cnt-lbl{font-size:9px;color:rgba(255,255,255,.6);margin-top:2px}
.cnt-keep .cnt-num{color:#34d399}
.cnt-mod .cnt-num{color:#fbbf24}
.cnt-rm .cnt-num{color:#f87171}
.cnt-new .cnt-num{color:#818cf8}
.btn-add{background:#6366f1;border:none;color:#fff;font-size:12px;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-export{background:#22c55e;border:none;color:#fff;font-size:12px;font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-reset{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);font-size:11px;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.main{max-width:900px;margin:0 auto;padding:24px 16px}
.cat-block{margin-bottom:32px}
.cat-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
.cat-name{font-size:15px;font-weight:800;color:#1e1b4b}
.cat-count{font-size:11px;color:#94a3b8;font-weight:600}
.tool-card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:8px;border:2px solid transparent;transition:border-color .15s,background .15s}
.tool-card.keep{border-color:#34d399;background:#f0fdf4}
.tool-card.mod{border-color:#fbbf24;background:#fffbeb}
.tool-card.rm{border-color:#fca5a5;background:#fff5f5;opacity:.7}
.tool-card.isnew{border-color:#a5b4fc;background:#eef2ff}
.tool-card.isnew.keep{border-color:#34d399;background:#f0fdf4}
.tool-card.isnew.mod{border-color:#fbbf24;background:#fffbeb}
.tool-card.isnew.rm{border-color:#fca5a5;background:#fff5f5;opacity:.7}
.tool-top{display:flex;align-items:flex-start;gap:12px}
.tool-id{font-size:10px;color:#94a3b8;font-weight:700;min-width:24px;padding-top:2px}
.badge-new{display:inline-block;background:#6366f1;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
.tool-info{flex:1;min-width:0}
.tool-name{font-size:14px;font-weight:700;color:#0f172a;line-height:1.3}
.tool-meta{font-size:11px;color:#64748b;margin-top:3px}
.tool-bef{font-size:11px;color:#64748b;margin-top:6px;line-height:1.5;background:#f8fafc;border-radius:6px;padding:6px 10px;border-left:3px solid #e2e8f0}
.tool-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start;padding-top:1px}
.btn-keep,.btn-mod,.btn-rm{border:none;border-radius:7px;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn-keep{background:#f0fdf4;color:#15803d;border:1.5px solid #86efac}
.btn-mod{background:#fffbeb;color:#b45309;border:1.5px solid #fcd34d}
.btn-rm{background:#fff5f5;color:#dc2626;border:1.5px solid #fca5a5}
.btn-keep.active,.tool-card.keep .btn-keep{background:#22c55e;color:#fff;border-color:#22c55e}
.btn-mod.active,.tool-card.mod .btn-mod{background:#f59e0b;color:#fff;border-color:#f59e0b}
.btn-rm.active,.tool-card.rm .btn-rm{background:#ef4444;color:#fff;border-color:#ef4444}
.btn-del{background:none;border:none;color:#cbd5e1;font-size:14px;cursor:pointer;padding:4px 6px;border-radius:4px;line-height:1;margin-left:2px}
.btn-del:hover{color:#ef4444;background:#fef2f2}
.tool-note{margin-top:8px;display:none}
.tool-note.show{display:block}
.tool-note textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:6px;padding:7px 10px;font-size:11px;font-family:inherit;color:#475569;resize:vertical;min-height:48px;outline:none}
.tool-note textarea:focus{border-color:#818cf8}

/* モーダル共通 */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-ttl{font-size:17px;font-weight:800;color:#1e1b4b;margin-bottom:6px}
.modal-sub{font-size:12px;color:#64748b;margin-bottom:20px;line-height:1.6}
.modal-pre{background:#f1f5f9;border-radius:8px;padding:14px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:300px;overflow-y:auto;line-height:1.7;color:#334155}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.btn-copy{background:#4f46e5;border:none;color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-close{background:#f1f5f9;border:none;color:#64748b;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:inherit}

/* 新規追加フォーム */
.add-form{display:flex;flex-direction:column;gap:12px}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-field label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px}
.add-field input,.add-field select,.add-field textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;color:#0f172a;outline:none;background:#fff}
.add-field input:focus,.add-field select:focus,.add-field textarea:focus{border-color:#6366f1}
.add-field textarea{min-height:64px;resize:vertical}
.add-field.full{grid-column:1/-1}
.btn-submit{background:#6366f1;border:none;color:#fff;font-size:13px;font-weight:700;padding:11px 24px;border-radius:8px;cursor:pointer;font-family:inherit}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;font-size:13px;font-weight:600;padding:11px 22px;border-radius:10px;z-index:300;animation:fdin .18s ease;pointer-events:none}
@keyframes fdin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.progress-bar{height:4px;background:#e2e8f0;position:sticky;top:64px;z-index:99}
.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);transition:width .3s}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-ttl">カタログ精査シート</div>
    <div class="hdr-sub">各ツールを「残す / 要修正 / 外す」で評価 ＋ 新規追加もできます</div>
  </div>
  <div class="hdr-right">
    <div class="counter">
      <div class="cnt-item cnt-keep"><div class="cnt-num" id="cnt-keep">0</div><div class="cnt-lbl">残す</div></div>
      <div class="cnt-item cnt-mod"><div class="cnt-num" id="cnt-mod">0</div><div class="cnt-lbl">要修正</div></div>
      <div class="cnt-item cnt-rm"><div class="cnt-num" id="cnt-rm">0</div><div class="cnt-lbl">外す</div></div>
      <div class="cnt-item cnt-new"><div class="cnt-num" id="cnt-new">0</div><div class="cnt-lbl">新規</div></div>
    </div>
    <button class="btn-add" onclick="showAddModal()">＋ 新規追加</button>
    <button class="btn-reset" onclick="resetAll()">リセット</button>
    <button class="btn-export" onclick="showExport()">結果を出力 →</button>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

<div class="main" id="main"></div>

<!-- 新規追加モーダル -->
<div id="add-modal" class="modal-ov" style="display:none" onclick="if(event.target===this)closeAdd()">
  <div class="modal">
    <div class="modal-ttl">✨ 新規ツールを追加</div>
    <div class="modal-sub">カタログに追加したいツールのアイデアを入力してください。<br>エクスポート時に「新規追加候補」としてまとめて出力されます。</div>
    <div class="add-form">
      <div class="add-row">
        <div class="add-field">
          <label>カテゴリ</label>
          <select id="add-cat">
            <option value="情報収集">情報収集</option>
            <option value="議事録・文書">議事録・文書</option>
            <option value="経営・財務">経営・財務</option>
            <option value="採用・人事">採用・人事</option>
            <option value="営業・マーケ">営業・マーケ</option>
            <option value="業界特化">業界特化</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="add-field">
          <label>ツール名</label>
          <input type="text" id="add-name" placeholder="例：契約書レビュー 自動化">
        </div>
      </div>
      <div class="add-row">
        <div class="add-field">
          <label>目安価格</label>
          <input type="text" id="add-price" placeholder="例：¥40,000〜">
        </div>
        <div class="add-field">
          <label>工数</label>
          <input type="text" id="add-period" placeholder="例：2〜3週間">
        </div>
      </div>
      <div class="add-field full">
        <label>困りごと（Before）— 入れると詳細ページにも反映されます</label>
        <textarea id="add-bef" placeholder="例：契約書のチェックに毎回1〜2時間かかる。見落としが怖くて何度も読み直す"></textarea>
      </div>
      <div class="add-field full">
        <label>メモ・補足</label>
        <textarea id="add-note" placeholder="なぜ追加したいか・参考事例・競合ツールなど"></textarea>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-close" onclick="closeAdd()">キャンセル</button>
      <button class="btn-submit" onclick="submitAdd()">追加する</button>
    </div>
  </div>
</div>

<!-- 出力モーダル -->
<div id="export-modal" class="modal-ov" style="display:none" onclick="if(event.target===this)document.getElementById('export-modal').style.display='none'">
  <div class="modal">
    <div class="modal-ttl">精査結果</div>
    <div class="modal-sub">以下の内容をコピーして Claude Code に貼り付けるとカタログに反映できます。</div>
    <pre class="modal-pre" id="export-pre"></pre>
    <div class="modal-btns">
      <button class="btn-close" onclick="document.getElementById('export-modal').style.display='none'">閉じる</button>
      <button class="btn-copy" onclick="copyExport()">コピー</button>
    </div>
  </div>
</div>

  {id:37,cat:'営業・マーケ',name:'広告クリエイティブ 自動生成',priceL:'¥40,000〜',period:'2週間',bef:'広告バナーのたびにデザイナーに依頼。完成まで3〜5日かかる'},
  {id:49,cat:'営業・マーケ',name:'ヒアリングシート 自動生成',priceL:'¥25,000〜',period:'1週間',bef:'初回面談のたびにヒアリングシートを手直し。「あれを聞き忘れた」が毎回起きる'},
  {id:50,cat:'営業・マーケ',name:'口コミ・紹介 管理ツール',priceL:'¥30,000〜',period:'1〜2週間',bef:'「〇〇さんに紹介してもらった」と来ても、お礼の連絡を忘れてしまいがち'},
  {id:31,cat:'業界特化',name:'食品ラベル（栄養成分表示）自動生成',priceL:'¥40,000〜',period:'2〜3週間',bef:'レシピが変わるたびに栄養計算をやり直してラベルを作り直す。1商品1時間以上'},
  {id:32,cat:'業界特化',name:'FP実績管理 ダッシュボード',priceL:'¥35,000〜',period:'2週間',bef:'月次の件数・コミッションをスクショから手入力。集計だけで毎月30分かかる'},
  {id:33,cat:'業界特化',name:'福祉事業所 給付費・工賃 自動集計',priceL:'¥50,000〜',period:'3〜4週間',bef:'毎月、給付費PDFから手作業で転記。1人ずつ確認して2時間かかっていた'},
  {id:40,cat:'業界特化',name:'支援記録・個別支援計画 自動作成',priceL:'¥50,000〜',period:'3週間',bef:'支援記録を書くために残業が続く。「記録のための支援」で本末転倒に感じる'},
  {id:41,cat:'業界特化',name:'予約管理ツール',priceL:'¥40,000〜',period:'2〜3週間',bef:'電話が鳴り続ける時間帯がある。手書きの予約台帳で2重予約も起こした'},
  {id:42,cat:'業界特化',name:'カルテ・施術記録 管理',priceL:'¥40,000〜',period:'2〜3週間',bef:'「前回どこが気になるって言ってたっけ」と施術前に焦って紙カルテを探している'},
  {id:43,cat:'業界特化',name:'生徒管理・保護者連絡ツール',priceL:'¥40,000〜',period:'2〜3週間',bef:'保護者への連絡をひとりずつLINEで送る。誰に送ったか確認しながら30分かかる'},
  {id:44,cat:'業界特化',name:'メニュー原価計算（飲食）',priceL:'¥30,000〜',period:'1〜2週間',bef:'「このメニュー、いくらで売れば利益が出るの？」が感覚値のまま値付けが決まる'},
];

const STATE = {};  // {id: {status, note}}
let NEW_TOOLS = []; // [{nid, cat, name, priceL, period, bef, note, status}]
const ALL_CATS = [...new Set(TOOLS.map(t=>t.cat))];

function load(){
  const s = localStorage.getItem('yumematch-curation-v1');
  if(s) Object.assign(STATE, JSON.parse(s));
  const n = localStorage.getItem('yumematch-curation-new-v1');
  if(n) NEW_TOOLS = JSON.parse(n);
}
function save(){
  localStorage.setItem('yumematch-curation-v1', JSON.stringify(STATE));
  localStorage.setItem('yumematch-curation-new-v1', JSON.stringify(NEW_TOOLS));
  updateCounter();
  updateProgress();
}

function allTools(){
  return [...TOOLS, ...NEW_TOOLS.map(n=>({...n, id:'n'+n.nid}))];
}

/* ── 既存ツール操作 ── */
function setStatus(id, status){
  if(!STATE[id]) STATE[id]={};
  STATE[id].status = STATE[id].status===status ? null : status;
  const card = document.getElementById('card-'+id);
  card.classList.remove('keep','mod','rm');
  if(STATE[id].status) card.classList.add(STATE[id].status);
  ['keep','mod','rm'].forEach(s=>{
    card.querySelector('.btn-'+s).classList.toggle('active', STATE[id].status===s);
  });
  card.querySelector('.tool-note').classList.toggle('show',
    STATE[id].status==='mod' || (STATE[id].note||'').length>0);
  save();
}
function setNote(id, val){
  if(!STATE[id]) STATE[id]={};
  STATE[id].note=val; save();
}

/* ── 新規ツール操作 ── */
function setNewStatus(nid, status){
  const t = NEW_TOOLS.find(x=>x.nid===nid);
  if(!t) return;
  t.status = t.status===status ? null : status;
  const card = document.getElementById('card-n'+nid);
  card.classList.remove('keep','mod','rm');
  if(t.status) card.classList.add(t.status);
  ['keep','mod','rm'].forEach(s=>{
    card.querySelector('.btn-'+s).classList.toggle('active', t.status===s);
  });
  card.querySelector('.tool-note').classList.toggle('show',
    t.status==='mod' || (t.note||'').length>0);
  save();
}
function setNewNote(nid, val){
  const t=NEW_TOOLS.find(x=>x.nid===nid); if(!t) return;
  t.note=val; save();
}
function deleteNew(nid){
  if(!confirm('削除しますか？')) return;
  NEW_TOOLS=NEW_TOOLS.filter(x=>x.nid!==nid);
  save(); render();
}

/* ── 新規追加モーダル ── */
function showAddModal(){
  ['add-name','add-price','add-period','add-bef','add-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('add-cat').value='情報収集';
  document.getElementById('add-modal').style.display='flex';
  setTimeout(()=>document.getElementById('add-name').focus(),100);
}
function closeAdd(){ document.getElementById('add-modal').style.display='none'; }
function submitAdd(){
  const name=document.getElementById('add-name').value.trim();
  if(!name){toast('ツール名を入力してください');return;}
  const nid = Date.now();
  NEW_TOOLS.push({
    nid,
    cat: document.getElementById('add-cat').value,
    name,
    priceL: document.getElementById('add-price').value.trim()||'未定',
    period: document.getElementById('add-period').value.trim()||'未定',
    bef:  document.getElementById('add-bef').value.trim(),
    note: document.getElementById('add-note').value.trim(),
    status: 'keep',
  });
  save(); render(); closeAdd();
  toast('✨ 追加しました：'+name);
}

/* ── カウンター・プログレス ── */
function updateCounter(){
  let keep=0,mod=0,rm=0;
  TOOLS.forEach(t=>{
    const s=STATE[t.id]?.status;
    if(s==='keep') keep++; else if(s==='mod') mod++; else if(s==='rm') rm++;
  });
  NEW_TOOLS.forEach(t=>{
    if(t.status==='keep') keep++; else if(t.status==='mod') mod++; else if(t.status==='rm') rm++;
  });
  document.getElementById('cnt-keep').textContent=keep;
  document.getElementById('cnt-mod').textContent=mod;
  document.getElementById('cnt-rm').textContent=rm;
  document.getElementById('cnt-new').textContent=NEW_TOOLS.length;
}
function updateProgress(){
  const existing = TOOLS.filter(t=>STATE[t.id]?.status).length;
  const total = TOOLS.length;
  document.getElementById('progress').style.width=(existing/total*100)+'%';
}

/* ── レンダリング ── */
function renderCard(t, isNew=false){
  const id = isNew ? 'n'+t.nid : t.id;
  const s = isNew ? (t.status||'') : (STATE[t.id]?.status||'');
  const note = isNew ? (t.note||'') : (STATE[t.id]?.note||'');
  const showNote = s==='mod' || note.length>0;
  const onStatus = isNew ? `setNewStatus(${t.nid},'STAT')` : `setStatus(${t.id},'STAT')`;
  const onNote = isNew ? `setNewNote(${t.nid},this.value)` : `setNote(${t.id},this.value)`;
  return`<div class="tool-card ${s}${isNew?' isnew':''}" id="card-${id}">
    <div class="tool-top">
      <div class="tool-id">${isNew?'NEW':'#'+t.id}</div>
      <div class="tool-info">
        <div class="tool-name">${t.name}${isNew?'<span class="badge-new">新規</span>':''}</div>
        <div class="tool-meta">${t.priceL} ／ 工数 ${t.period}</div>
        ${t.bef?`<div class="tool-bef">😓 ${t.bef}</div>`:''}
      </div>
      <div class="tool-actions">
        <button class="btn-keep${s==='keep'?' active':''}" onclick="${onStatus.replace('STAT','keep')}">✅ 残す</button>
        <button class="btn-mod${s==='mod'?' active':''}" onclick="${onStatus.replace('STAT','mod')}">✏️ 要修正</button>
        <button class="btn-rm${s==='rm'?' active':''}" onclick="${onStatus.replace('STAT','rm')}">🗑️ 外す</button>
        ${isNew?`<button class="btn-del" onclick="deleteNew(${t.nid})" title="削除">×</button>`:''}
      </div>
    </div>
    <div class="tool-note${showNote?' show':''}">
      <textarea placeholder="修正内容・補足メモなど..." onchange="${onNote}">${note}</textarea>
    </div>
  </div>`;
}

function render(){
  const allCats = [...new Set([...ALL_CATS, ...NEW_TOOLS.map(n=>n.cat)])];
  document.getElementById('main').innerHTML = allCats.map(cat=>{
    const existing = TOOLS.filter(t=>t.cat===cat);
    const added = NEW_TOOLS.filter(t=>t.cat===cat);
    if(!existing.length && !added.length) return '';
    return`<div class="cat-block">
      <div class="cat-hdr">
        <span class="cat-name">${cat}</span>
        <span class="cat-count">${existing.length+added.length}ツール${added.length?` (+${added.length}新規)`:''}</span>
      </div>
      ${existing.map(t=>renderCard(t,false)).join('')}
      ${added.map(t=>renderCard(t,true)).join('')}
    </div>`;
  }).join('');
}

/* ── エクスポート ── */
function showExport(){
  const keep=[],mod=[],rm=[],undecided=[];
  TOOLS.forEach(t=>{
    const s=STATE[t.id]?.status;
    if(s==='keep') keep.push({...t,note:STATE[t.id]?.note||''});
    else if(s==='mod') mod.push({...t,note:STATE[t.id]?.note||''});
    else if(s==='rm') rm.push({...t,note:STATE[t.id]?.note||''});
    else undecided.push(t);
  });
  const newKeep=[],newMod=[],newRm=[];
  NEW_TOOLS.forEach(t=>{
    if(t.status==='keep'||!t.status) newKeep.push(t);
    else if(t.status==='mod') newMod.push(t);
    else if(t.status==='rm') newRm.push(t);
  });

  const lines=[];
  lines.push(`=== カタログ精査結果 ===`);
  lines.push(`判断済み: ${keep.length+mod.length+rm.length} / ${TOOLS.length}ツール  新規追加: ${NEW_TOOLS.length}本\n`);
  if(keep.length){
    lines.push(`【残す】 ${keep.length}本`);
    keep.forEach(t=>lines.push(`  #${t.id} ${t.name}`));
    lines.push('');
  }
  if(mod.length){
    lines.push(`【要修正】 ${mod.length}本`);
    mod.forEach(t=>{lines.push(`  #${t.id} ${t.name}${t.note?'\n    → '+t.note:''}`)});
    lines.push('');
  }
  if(rm.length){
    lines.push(`【外す】 ${rm.length}本`);
    rm.forEach(t=>lines.push(`  #${t.id} ${t.name}`));
    lines.push('');
  }
  if(undecided.length){
    lines.push(`【未判断】 ${undecided.length}本`);
    undecided.forEach(t=>lines.push(`  #${t.id} ${t.name}`));
    lines.push('');
  }
  if(NEW_TOOLS.length){
    lines.push(`【新規追加候補】 ${newKeep.length+newMod.length}本`);
    [...newKeep,...newMod].forEach(t=>{
      lines.push(`  [${t.cat}] ${t.name}`);
      lines.push(`    価格: ${t.priceL} ／ 工数: ${t.period}`);
      if(t.bef) lines.push(`    困りごと: ${t.bef}`);
      if(t.note) lines.push(`    メモ: ${t.note}`);
    });
    if(newRm.length){
      lines.push('');
      lines.push(`  （見送り: ${newRm.map(t=>t.name).join('、')}）`);
    }
  }
  document.getElementById('export-pre').textContent=lines.join('\n');
  document.getElementById('export-modal').style.display='flex';
}
function copyExport(){
  navigator.clipboard.writeText(document.getElementById('export-pre').textContent).then(()=>toast('コピーしました'));
}

function resetAll(){
  if(!confirm('全ての評価と新規追加をリセットしますか？')) return;
  Object.keys(STATE).forEach(k=>delete STATE[k]);
  NEW_TOOLS=[];
  localStorage.removeItem('yumematch-curation-v1');
  localStorage.removeItem('yumematch-curation-new-v1');
  render(); updateCounter(); updateProgress();
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}

load(); render(); updateCounter(); updateProgress();
</script>
</body>
</html>
