<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カタログ精査シート｜YUMEMATCH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{background:#1e1b4b;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.hdr-ttl{font-size:16px;font-weight:800;letter-spacing:-.03em}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.hdr-right{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.counter{background:rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-size:12px;display:flex;gap:10px}
.cnt-item{text-align:center}
.cnt-num{font-size:16px;font-weight:900;line-height:1}
.cnt-lbl{font-size:9px;color:rgba(255,255,255,.6);margin-top:2px}
.cnt-pend .cnt-num{color:#94a3b8}
.cnt-keep .cnt-num{color:#34d399}
.cnt-mod .cnt-num{color:#fbbf24}
.cnt-rm .cnt-num{color:#f87171}
.cnt-new .cnt-num{color:#818cf8}
.btn-add{background:#6366f1;border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-export{background:#22c55e;border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-reset{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);font-size:11px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.progress-bar{height:3px;background:#334155;flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);transition:width .3s}
/* Board */
.board{flex:1;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:12px 16px;min-height:0}
.column{display:flex;flex-direction:column;min-width:250px;flex:1;border-radius:10px;overflow:hidden;min-height:0}
.col-hdr{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.col-pend .col-hdr{background:#cbd5e1}
.col-keep .col-hdr{background:#bbf7d0}
.col-mod .col-hdr{background:#fde68a}
.col-rm .col-hdr{background:#fecaca}
.col-hdr-name{font-size:13px;font-weight:800;color:#1e293b}
.col-count{background:rgba(0,0,0,.15);border-radius:8px;font-size:11px;font-weight:800;padding:2px 8px;color:#1e293b}
.col-body{flex:1;overflow-y:auto;padding:8px;min-height:80px;transition:background .12s}
.col-body.drag-over{outline:2px dashed #818cf8;outline-offset:-3px;border-radius:6px}
.col-pend .col-body{background:#e2e8f0}
.col-keep .col-body{background:#f0fdf4}
.col-mod .col-body{background:#fffbeb}
.col-rm .col-body{background:#fff5f5}
.col-pend .col-body.drag-over{background:#dde4ed}
.col-keep .col-body.drag-over{background:#dcfce7}
.col-mod .col-body.drag-over{background:#fef9c3}
.col-rm .col-body.drag-over{background:#fee2e2}
/* Cards */
.kcard{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:6px;cursor:grab;border:1.5px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .12s,opacity .15s,transform .1s;position:relative;-webkit-user-select:none;user-select:none}
.kcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);transform:translateY(-1px)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.25;transform:scale(.96)}
.col-keep .kcard{border-color:#86efac}
.col-mod .kcard{border-color:#fcd34d}
.col-rm .kcard{border-color:#fca5a5;opacity:.8}
.kcard.isnew{background:#f5f3ff;border-color:#c4b5fd}
.col-keep .kcard.isnew{border-color:#6ee7b7}
.col-mod .kcard.isnew{border-color:#fcd34d}
.col-rm .kcard.isnew{border-color:#fca5a5}
.kcard-hd{display:flex;align-items:flex-start;gap:5px;margin-bottom:3px}
.kcard-id{font-size:9px;color:#94a3b8;font-weight:700;flex-shrink:0;padding-top:2px;min-width:22px}
.kcard-name{font-size:12px;font-weight:700;color:#0f172a;line-height:1.35;flex:1}
.kcard-del{background:none;border:none;color:#d1d5db;font-size:13px;cursor:pointer;padding:0 3px;line-height:1;flex-shrink:0;margin-top:1px}
.kcard-del:hover{color:#ef4444}
.kcard-cat{display:inline-block;font-size:9px;font-weight:700;color:#4f46e5;background:#eef2ff;padding:1px 6px;border-radius:3px;margin-bottom:4px}
.kcard-meta{font-size:10px;color:#64748b;margin-bottom:4px}
.kcard-bef{font-size:10px;color:#64748b;background:#f8fafc;border-radius:4px;padding:4px 7px;border-left:2px solid #cbd5e1;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge-new{display:inline-block;background:#6366f1;color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;letter-spacing:.03em}
.badge-dup{display:inline-block;background:#f59e0b;color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;letter-spacing:.03em}
.kcard-note{margin-top:6px}
.kcard-note textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:5px;padding:5px 8px;font-size:10px;font-family:inherit;color:#475569;resize:vertical;min-height:40px;outline:none;cursor:text;-webkit-user-select:text;user-select:text}
.kcard-note textarea:focus{border-color:#818cf8}
/* Modals */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-ttl{font-size:17px;font-weight:800;color:#1e1b4b;margin-bottom:6px}
.modal-sub{font-size:12px;color:#64748b;margin-bottom:20px;line-height:1.6}
.modal-pre{background:#f1f5f9;border-radius:8px;padding:14px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:300px;overflow-y:auto;line-height:1.7;color:#334155}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.btn-copy{background:#4f46e5;border:none;color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-close{background:#f1f5f9;border:none;color:#64748b;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:inherit}
.add-form{display:flex;flex-direction:column;gap:12px}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-field label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px}
.add-field input,.add-field select,.add-field textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;color:#0f172a;outline:none;background:#fff}
.add-field input:focus,.add-field select:focus,.add-field textarea:focus{border-color:#6366f1}
.add-field textarea{min-height:64px;resize:vertical}
.add-field.full{grid-column:1/-1}
.btn-submit{background:#6366f1;border:none;color:#fff;font-size:13px;font-weight:700;padding:11px 24px;border-radius:8px;cursor:pointer;font-family:inherit}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;font-size:13px;font-weight:600;padding:11px 22px;border-radius:10px;z-index:300;animation:fdin .18s ease;pointer-events:none}
@keyframes fdin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-ttl">カタログ精査シート</div>
    <div class="hdr-sub">カードをドラッグして「残す / 要修正 / 外す」に振り分けてください</div>
  </div>
  <div class="hdr-right">
    <div class="counter">
      <div class="cnt-item cnt-pend"><div class="cnt-num" id="cnt-pend">0</div><div class="cnt-lbl">未評価</div></div>
      <div class="cnt-item cnt-keep"><div class="cnt-num" id="cnt-keep">0</div><div class="cnt-lbl">残す</div></div>
      <div class="cnt-item cnt-mod"><div class="cnt-num" id="cnt-mod">0</div><div class="cnt-lbl">要修正</div></div>
      <div class="cnt-item cnt-rm"><div class="cnt-num" id="cnt-rm">0</div><div class="cnt-lbl">外す</div></div>
      <div class="cnt-item cnt-new"><div class="cnt-num" id="cnt-new">0</div><div class="cnt-lbl">新規</div></div>
    </div>
    <button class="btn-add" onclick="showAddModal()">＋ 新規追加</button>
    <button class="btn-reset" onclick="resetAll()">リセット</button>
    <button class="btn-export" onclick="showExport()">結果を出力 →</button>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

<div class="board" id="board"></div>

<!-- 新規追加モーダル -->
<div id="add-modal" class="modal-ov" style="display:none" onclick="if(event.target===this)closeAdd()">
  <div class="modal">
    <div class="modal-ttl">✨ 新規ツールを追加</div>
    <div class="modal-sub">カタログに追加したいツールのアイデアを入力してください。<br>エクスポート時に「新規追加候補」としてまとめて出力されます。</div>
    <div class="add-form">
      <div class="add-row">
        <div class="add-field">
          <label>カテゴリ</label>
          <select id="add-cat">
            <option value="情報収集">情報収集</option>
            <option value="議事録・文書">議事録・文書</option>
            <option value="経営・財務">経営・財務</option>
            <option value="採用・人事">採用・人事</option>
            <option value="営業・マーケ">営業・マーケ</option>
            <option value="業界特化">業界特化</option>
            <option value="組織マネジメント">組織マネジメント</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="add-field">
          <label>ツール名</label>
          <input type="text" id="add-name" placeholder="例：契約書レビュー 自動化">
        </div>
      </div>
      <div class="add-row">
        <div class="add-field">
          <label>目安価格</label>
          <input type="text" id="add-price" placeholder="例：¥40,000〜">
        </div>
        <div class="add-field">
          <label>工数</label>
          <input type="text" id="add-period" placeholder="例：2〜3週間">
        </div>
      </div>
      <div class="add-field full">
        <label>困りごと（Before）</label>
        <textarea id="add-bef" placeholder="例：契約書のチェックに毎回1〜2時間かかる。見落としが怖くて何度も読み直す"></textarea>
      </div>
      <div class="add-field full">
        <label>メモ・補足</label>
        <textarea id="add-note" placeholder="なぜ追加したいか・参考事例・競合ツールなど"></textarea>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-close" onclick="closeAdd()">キャンセル</button>
      <button class="btn-submit" onclick="submitAdd()">追加する</button>
    </div>
  </div>
</div>

<!-- 出力モーダル -->
<div id="export-modal" class="modal-ov" style="display:none" onclick="if(event.target===this)document.getElementById('export-modal').style.display='none'">
  <div class="modal">
    <div class="modal-ttl">精査結果</div>
    <div class="modal-sub">以下の内容をコピーして Claude Code に貼り付けるとカタログに反映できます。</div>
    <pre class="modal-pre" id="export-pre"></pre>
    <div class="modal-btns">
      <button class="btn-close" onclick="document.getElementById('export-modal').style.display='none'">閉じる</button>
      <button class="btn-copy" onclick="copyExport()">コピー</button>
    </div>
  </div>
</div>

const STATE = {};
let NEW_TOOLS = [];

const PRESET_NEW=[
  {nid:1000000001,cat:'組織マネジメント',name:'社内情報共有・理念浸透ポータル',priceL:'¥60,000〜',period:'3〜4週間',
   bef:'連絡がチャットで流れ、理念や目標が浸透しない。「また聞いてなかった」が繰り返される',
   note:'Gemini BEST10 #1。社内SNS・自動情報配信・KPI可視化を1つに統合。経営者の分身ツール',status:'keep'},
  {nid:1000000002,cat:'議事録・文書',name:'書類スキャン→即時生成システム',priceL:'¥40,000〜',period:'2〜3週間',
   bef:'書類を作るたびにPCを開いて過去ファイルを探してゼロから編集。スマホでできればいいのに',
   note:'Gemini BEST10 #3。送付状・報告書・契約書など、スマホ写真1枚から書類を自動生成する汎用システム',status:'keep'},
  {nid:1000000003,cat:'営業・マーケ',name:'AI業務改善 ROIシミュレーター',priceL:'¥25,000〜',period:'1週間',
   bef:'「どれくらい楽になるか」がイメージできず、顧客がAI導入に踏み切れない',
   note:'Gemini BEST10 #4。質問に答えるだけで削減時間・コスト削減額・投資回収期間を可視化。商談ツールとして使える',status:'keep'},
];

/* ── ドラッグ状態 ── */
let _dragId = null;
let _dragIsNew = false;
let _dragging = false;

function dragStart(e, id, isNew) {
  _dragId = id;
  _dragIsNew = isNew;
  _dragging = true;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const card = document.getElementById('card-' + (isNew ? 'n'+id : id));
    if (card) card.classList.add('dragging');
  }, 0);
}
function dragEnd(e, id, isNew) {
  const card = document.getElementById('card-' + (isNew ? 'n'+id : id));
  if (card) card.classList.remove('dragging');
  _dragging = false;
}
function dragOver(e, el) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  el.classList.add('drag-over');
}
function dragLeave(e, el) {
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  el.classList.remove('drag-over');
}
function drop(e, el, status) {
  e.preventDefault();
  el.classList.remove('drag-over');
  if (!_dragging) return;
  _dragging = false;
  const newStatus = status || null;
  if (_dragIsNew) {
    const t = NEW_TOOLS.find(x => x.nid === _dragId);
    if (t) t.status = newStatus;
  } else {
    if (!STATE[_dragId]) STATE[_dragId] = {};
    STATE[_dragId].status = newStatus;
  }
  save();
  renderBoard();
}

/* ── 永続化 ── */
function load(){
  const s = localStorage.getItem('yumematch-curation-v1');
  if (s) Object.assign(STATE, JSON.parse(s));
  const n = localStorage.getItem('yumematch-curation-new-v1');
  if (n) { NEW_TOOLS = JSON.parse(n); } else { NEW_TOOLS = PRESET_NEW.map(t=>({...t})); }
}
function save(){
  localStorage.setItem('yumematch-curation-v1', JSON.stringify(STATE));
  localStorage.setItem('yumematch-curation-new-v1', JSON.stringify(NEW_TOOLS));
  updateCounter();
  updateProgress();
}

/* ── メモ保存（再レンダリングなし） ── */
function setNote(id, val){
  if (!STATE[id]) STATE[id] = {};
  STATE[id].note = val; save();
}
function setNewNote(nid, val){
  const t = NEW_TOOLS.find(x => x.nid === nid);
  if (t) { t.note = val; save(); }
}
function deleteNew(nid){
  if (!confirm('削除しますか？')) return;
  NEW_TOOLS = NEW_TOOLS.filter(x => x.nid !== nid);
  save(); renderBoard();
}

/* ── カード HTML ── */
function renderCard(t, isNew) {
  const id = isNew ? 'n' + t.nid : t.id;
  const rawId = isNew ? t.nid : t.id;
  const status = isNew ? t.status : STATE[t.id]?.status;
  const note = isNew ? (t.note || '') : (STATE[t.id]?.note || '');
  const showNote = status === 'mod' || note.length > 0;
  const onNote = isNew ? `setNewNote(${rawId},this.value)` : `setNote(${rawId},this.value)`;

  return `<div class="kcard${isNew?' isnew':''}" id="card-${id}"
      draggable="true"
      ondragstart="dragStart(event,${rawId},${isNew})"
      ondragend="dragEnd(event,${rawId},${isNew})">
    <div class="kcard-hd">
      <div class="kcard-id">${isNew?'NEW':'#'+t.id}</div>
      <div class="kcard-name">${t.name}${isNew?'<span class="badge-new">新規</span>':''}${t.dup?`<span class="badge-dup">⚠️ ${t.dup}</span>`:''}</div>
      ${isNew?`<button class="kcard-del" onclick="deleteNew(${rawId});event.stopPropagation()" title="削除">×</button>`:''}
    </div>
    <div class="kcard-cat">${t.cat}</div>
    <div class="kcard-meta">${t.priceL} ／ 工数 ${t.period}</div>
    ${t.bef?`<div class="kcard-bef">😓 ${t.bef}</div>`:''}
    ${showNote?`<div class="kcard-note"><textarea placeholder="修正内容・補足メモ..." onchange="${onNote}">${note}</textarea></div>`:''}
  </div>`;
}

/* ── ボード レンダリング ── */
const COLUMNS = [
  { status: null,   label: '📋 未評価', cls: 'col-pend', dropVal: '' },
  { status: 'keep', label: '✅ 残す',   cls: 'col-keep', dropVal: 'keep' },
  { status: 'mod',  label: '✏️ 要修正', cls: 'col-mod',  dropVal: 'mod' },
  { status: 'rm',   label: '🗑️ 外す',   cls: 'col-rm',   dropVal: 'rm' },
];

function renderBoard() {
  document.getElementById('board').innerHTML = COLUMNS.map(col => {
    const existing = TOOLS.filter(t => {
      const s = STATE[t.id]?.status || null;
      return s === col.status;
    });
    const added = NEW_TOOLS.filter(t => {
      const s = t.status || null;
      return s === col.status;
    });
    const cards = [...existing.map(t => renderCard(t, false)), ...added.map(t => renderCard(t, true))];
    const count = cards.length;

    return `<div class="column ${col.cls}">
      <div class="col-hdr">
        <span class="col-hdr-name">${col.label}</span>
        <span class="col-count">${count}</span>
      </div>
      <div class="col-body"
        ondragover="dragOver(event,this)"
        ondragleave="dragLeave(event,this)"
        ondrop="drop(event,this,'${col.dropVal}')">
        ${cards.join('')}
      </div>
    </div>`;
  }).join('');

  updateCounter();
  updateProgress();
}

/* ── カウンター・プログレス ── */
function updateCounter(){
  let pend=0, keep=0, mod=0, rm=0;
  TOOLS.forEach(t => {
    const s = STATE[t.id]?.status || null;
    if (!s) pend++; else if (s==='keep') keep++; else if (s==='mod') mod++; else if (s==='rm') rm++;
  });
  NEW_TOOLS.forEach(t => {
    const s = t.status || null;
    if (s==='keep') keep++; else if (s==='mod') mod++; else if (s==='rm') rm++;
  });
  document.getElementById('cnt-pend').textContent = pend;
  document.getElementById('cnt-keep').textContent = keep;
  document.getElementById('cnt-mod').textContent  = mod;
  document.getElementById('cnt-rm').textContent   = rm;
  document.getElementById('cnt-new').textContent  = NEW_TOOLS.length;
}
function updateProgress(){
  const rated = TOOLS.filter(t => STATE[t.id]?.status).length;
  document.getElementById('progress').style.width = (rated / TOOLS.length * 100) + '%';
}

/* ── 新規追加モーダル ── */
function showAddModal(){
  ['add-name','add-price','add-period','add-bef','add-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('add-cat').value = '情報収集';
  document.getElementById('add-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('add-name').focus(), 100);
}
function closeAdd(){ document.getElementById('add-modal').style.display = 'none'; }
function submitAdd(){
  const name = document.getElementById('add-name').value.trim();
  if (!name) { toast('ツール名を入力してください'); return; }
  NEW_TOOLS.push({
    nid: Date.now(),
    cat:    document.getElementById('add-cat').value,
    name,
    priceL: document.getElementById('add-price').value.trim() || '未定',
    period: document.getElementById('add-period').value.trim() || '未定',
    bef:    document.getElementById('add-bef').value.trim(),
    note:   document.getElementById('add-note').value.trim(),
    status: 'keep',
  });
  save(); renderBoard(); closeAdd();
  toast('✨ 追加しました：' + name);
}

/* ── エクスポート ── */
function showExport(){
  const keep=[], mod=[], rm=[], undecided=[];
  TOOLS.forEach(t => {
    const s = STATE[t.id]?.status;
    if (s==='keep') keep.push({...t, note: STATE[t.id]?.note||''});
    else if (s==='mod') mod.push({...t, note: STATE[t.id]?.note||''});
    else if (s==='rm') rm.push({...t, note: STATE[t.id]?.note||''});
    else undecided.push(t);
  });
  const newKeep=[], newMod=[], newRm=[];
  NEW_TOOLS.forEach(t => {
    if (t.status==='keep'||!t.status) newKeep.push(t);
    else if (t.status==='mod') newMod.push(t);
    else if (t.status==='rm') newRm.push(t);
  });
  const lines = [];
  lines.push(`=== カタログ精査結果 ===`);
  lines.push(`判断済み: ${keep.length+mod.length+rm.length} / ${TOOLS.length}ツール  新規追加: ${NEW_TOOLS.length}本\n`);
  if (keep.length) {
    lines.push(`【残す】 ${keep.length}本`);
    keep.forEach(t => lines.push(`  #${t.id} ${t.name}`));
    lines.push('');
  }
  if (mod.length) {
    lines.push(`【要修正】 ${mod.length}本`);
    mod.forEach(t => { lines.push(`  #${t.id} ${t.name}${t.note?'\n    → '+t.note:''}`); });
    lines.push('');
  }
  if (rm.length) {
    lines.push(`【外す】 ${rm.length}本`);
    rm.forEach(t => lines.push(`  #${t.id} ${t.name}`));
    lines.push('');
  }
  if (undecided.length) {
    lines.push(`【未判断】 ${undecided.length}本`);
    undecided.forEach(t => lines.push(`  #${t.id} ${t.name}`));
    lines.push('');
  }
  if (NEW_TOOLS.length) {
    lines.push(`【新規追加候補】 ${newKeep.length+newMod.length}本`);
    [...newKeep, ...newMod].forEach(t => {
      lines.push(`  [${t.cat}] ${t.name}`);
      lines.push(`    価格: ${t.priceL} ／ 工数: ${t.period}`);
      if (t.bef)  lines.push(`    困りごと: ${t.bef}`);
      if (t.note) lines.push(`    メモ: ${t.note}`);
    });
    if (newRm.length) { lines.push(''); lines.push(`  （見送り: ${newRm.map(t=>t.name).join('、')}）`); }
  }
  document.getElementById('export-pre').textContent = lines.join('\n');
  document.getElementById('export-modal').style.display = 'flex';
}
function copyExport(){
  navigator.clipboard.writeText(document.getElementById('export-pre').textContent).then(() => toast('コピーしました'));
}

function resetAll(){
  if (!confirm('全ての評価と新規追加をリセットしますか？')) return;
  Object.keys(STATE).forEach(k => delete STATE[k]);
  NEW_TOOLS = [];
  localStorage.removeItem('yumematch-curation-v1');
  localStorage.removeItem('yumematch-curation-new-v1');
  renderBoard();
}

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

load(); renderBoard();
</script>
