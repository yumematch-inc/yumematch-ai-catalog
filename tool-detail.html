<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツール詳細 | YUMEMATCH AI業務改善</title>
<style>
:root{
  --bg:#f4f6fb;--white:#fff;--bdr:#e4e9f2;--bdr-d:#c9d3e6;
  --ink:#0f172a;--sub:#475569;--mute:#94a3b8;
  --indigo:#4f46e5;--indigo-d:#3730a3;--indigo-bg:#eef2ff;--indigo-bdr:rgba(79,70,229,.18);
  --green:#059669;--green-lt:#ecfdf5;
  --red:#e11d48;--red-lt:#fff1f2;
  --amber:#92400e;
  --sh:0 1px 4px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 16px rgba(15,23,42,.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;}

/* ── Header ── */
.hdr{height:52px;background:var(--white);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;}
.hdr-in{max-width:1120px;margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;gap:12px;}
.back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);text-decoration:none;padding:6px 12px;border-radius:7px;border:1px solid var(--bdr);background:var(--white);transition:all .15s;white-space:nowrap;}
.back:hover{color:var(--indigo);border-color:var(--indigo-bdr);}
.hdr-name{font-size:14px;font-weight:700;color:var(--ink);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-cta{padding:8px 16px;border-radius:7px;background:var(--green);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(5,150,105,.3);white-space:nowrap;}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#4338ca 100%);color:#fff;padding:52px 20px 44px;}
.hero-in{max-width:1120px;margin:0 auto;}
.hero-tags{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.hero-cat{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);}
.hero-sym{font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.9);}
.hero-sym.s-super{background:rgba(225,29,72,.28);border-color:rgba(225,29,72,.45);}
.hero-sym.s-high{background:rgba(251,191,36,.2);border-color:rgba(251,191,36,.38);color:#fde68a;}
.hero-ttl{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1.2;margin-bottom:14px;}
.hero-sub{font-size:15px;opacity:.78;max-width:640px;line-height:1.75;margin-bottom:36px;}
.metrics{display:flex;gap:14px;flex-wrap:wrap;}
.metric{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 22px;min-width:116px;}
.metric-val{font-size:26px;font-weight:900;letter-spacing:-.05em;line-height:1;color:#fff;}
.metric-lbl{font-size:11px;opacity:.62;margin-top:5px;}

/* ── Content ── */
.content{max-width:1120px;margin:0 auto;padding:40px 20px 96px;display:grid;grid-template-columns:1fr 420px;gap:36px;align-items:start;}
@media(max-width:920px){.content{grid-template-columns:1fr;}}

/* ── BA Section ── */
.ba-col{}
.ba-box{border-radius:16px;padding:26px 30px;margin-bottom:6px;}
.ba-box.before{background:var(--red-lt);border:1.5px solid rgba(225,29,72,.16);}
.ba-box.after{background:var(--green-lt);border:1.5px solid rgba(5,150,105,.16);}
.ba-label{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px;}
.ba-label.lb{color:var(--red);}
.ba-label.la{color:var(--green);}
.ba-ico{font-size:17px;}
.ba-pts{display:flex;flex-direction:column;gap:12px;}
.ba-pt{display:flex;align-items:flex-start;gap:11px;}
.ba-mk{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;}
.before .ba-mk{background:rgba(225,29,72,.13);color:var(--red);}
.after .ba-mk{background:rgba(5,150,105,.13);color:var(--green);}
.ba-txt{font-size:13px;line-height:1.7;}
.before .ba-txt{color:#64172a;}
.after .ba-txt{color:#064e3b;font-weight:500;}

.arrow-row{padding:14px 24px;display:flex;align-items:center;justify-content:center;gap:12px;}
.arrow-line{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--indigo),transparent);}
.arrow-pill{font-size:12px;font-weight:700;color:var(--indigo);white-space:nowrap;padding:7px 16px;border:1.5px solid var(--indigo-bdr);border-radius:20px;background:var(--indigo-bg);}

.info-chips{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;}
.info-chip{display:flex;flex-direction:column;gap:3px;padding:10px 16px;border-radius:10px;background:var(--white);border:1px solid var(--bdr);box-shadow:var(--sh);}
.info-chip-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}
.info-chip-val{font-size:13px;font-weight:700;color:var(--ink);}

/* ── Mock Panel ── */
.mock-col{position:sticky;top:72px;}
.mock-wrap{background:var(--white);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--sh-md);}
.mock-bar{background:var(--bg);border-bottom:1px solid var(--bdr);padding:10px 14px;display:flex;align-items:center;gap:7px;}
.dot{width:10px;height:10px;border-radius:50%;}
.mock-bar-title{font-size:11px;font-weight:600;color:var(--sub);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mock-body{}

/* ── CTA ── */
.cta{background:linear-gradient(135deg,#1e1b4b,#4338ca);padding:72px 20px;text-align:center;}
.cta-in{max-width:600px;margin:0 auto;}
.cta-ttl{font-size:28px;font-weight:900;color:#fff;letter-spacing:-.04em;margin-bottom:12px;}
.cta-sub{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:32px;line-height:1.8;}
.cta-btn{display:inline-flex;align-items:center;gap:9px;padding:16px 38px;border-radius:12px;background:var(--green);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(5,150,105,.4);transition:all .2s;}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(5,150,105,.5);}
.cta-note{font-size:11px;color:rgba(255,255,255,.45);margin-top:12px;}

/* ─────────────────────────────────────
   MOCK UI COMPONENTS
───────────────────────────────────── */

/* -- Notification List -- */
.m-list{padding:10px 0;}
.m-list-hdr{padding:4px 16px 8px;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
.m-item{padding:11px 16px;border-bottom:1px solid var(--bdr);display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:background .12s;}
.m-item:hover{background:var(--bg);}
.m-item:last-child{border-bottom:none;}
.m-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.m-body{flex:1;min-width:0;}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px;}
.m-name{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;}
.m-sub{font-size:11px;color:var(--mute);line-height:1.5;}
.m-act{margin-top:5px;font-size:10px;font-weight:700;color:var(--indigo);}
.badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.b-red{background:var(--red-lt);color:var(--red);border:1px solid rgba(225,29,72,.2);}
.b-green{background:var(--green-lt);color:var(--green);border:1px solid rgba(5,150,105,.2);}
.b-amber{background:#fffbeb;color:var(--amber);border:1px solid rgba(146,64,14,.18);}
.b-indigo{background:var(--indigo-bg);color:var(--indigo);border:1px solid var(--indigo-bdr);}

/* -- Dashboard -- */
.m-dash{padding:14px 16px 16px;}
.m-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.m-kpi{background:var(--bg);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid var(--bdr);}
.m-kpi-val{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.04em;}
.m-kpi-lbl{font-size:9px;color:var(--mute);margin-top:2px;}
.m-kpi-trend{font-size:9px;margin-top:3px;font-weight:700;}
.t-up{color:var(--green);}
.t-dn{color:var(--red);}
.m-chart-lbl{font-size:9px;font-weight:700;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.m-bars{display:flex;gap:3px;align-items:flex-end;height:56px;}
.m-bar{flex:1;border-radius:3px 3px 0 0;background:var(--indigo);opacity:.55;min-height:4px;}
.m-bar.cur{opacity:1;background:linear-gradient(180deg,var(--indigo),#7c3aed);}
.m-ml{display:flex;gap:3px;margin-top:3px;}
.m-ml div{flex:1;font-size:8px;text-align:center;color:var(--mute);}

/* -- Document -- */
.m-doc{padding:16px 18px;}
.m-doc-hdr{border-bottom:2px solid var(--indigo);padding-bottom:11px;margin-bottom:14px;}
.m-doc-title{font-size:13px;font-weight:800;color:var(--ink);}
.m-doc-meta{font-size:10px;color:var(--mute);margin-top:3px;}
.m-sec{margin-bottom:12px;}
.m-sec-title{font-size:9px;font-weight:800;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;background:var(--bg);border-radius:4px;display:inline-block;margin-bottom:5px;}
.m-sec-body{font-size:11px;color:var(--sub);line-height:1.75;}
.m-tag{display:inline-flex;align-items:center;gap:4px;margin:2px 2px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600;}
.m-tag.done{background:var(--green-lt);color:var(--green);}
.m-tag.todo{background:#fef3c7;color:var(--amber);}

/* -- Chat -- */
.m-chat{padding:12px 14px;display:flex;flex-direction:column;gap:9px;max-height:300px;overflow-y:auto;}
.msg{display:flex;gap:7px;}
.msg.user{flex-direction:row-reverse;}
.msg-av{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.msg-bbl{max-width:78%;padding:8px 12px;border-radius:12px;font-size:11px;line-height:1.6;}
.msg.bot .msg-bbl{background:var(--bg);border:1px solid var(--bdr);color:var(--ink);border-bottom-left-radius:4px;}
.msg.user .msg-bbl{background:var(--indigo);color:#fff;border-bottom-right-radius:4px;}

/* -- Table -- */
.m-tw{overflow-x:auto;}
.m-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.m-tbl th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:7px 12px;background:var(--bg);text-align:left;border-bottom:1.5px solid var(--bdr);white-space:nowrap;}
.m-tbl td{padding:8px 12px;border-bottom:1px solid var(--bdr);color:var(--ink);vertical-align:middle;}
.m-tbl tr:last-child td{border-bottom:none;}
.m-tbl tr:hover td{background:#fafbff;}
.st{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;white-space:nowrap;}
.st-done{background:var(--green-lt);color:var(--green);}
.st-pend{background:#fffbeb;color:var(--amber);}
.st-alert{background:var(--red-lt);color:var(--red);}

/* -- Calendar -- */
.m-cal{padding:14px 16px;}
.m-cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.m-cal-month{font-size:13px;font-weight:700;color:var(--ink);}
.m-cal-nav{width:24px;height:24px;border-radius:6px;border:1px solid var(--bdr);background:var(--white);cursor:pointer;font-size:11px;color:var(--mute);display:flex;align-items:center;justify-content:center;}
.m-cg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;margin-bottom:12px;}
.m-dow{font-size:8px;font-weight:700;color:var(--mute);padding:3px 0;}
.m-day{font-size:11px;padding:5px 2px;border-radius:6px;color:var(--mute);}
.m-day.av{color:var(--ink);font-weight:600;cursor:pointer;}
.m-day.av:hover{background:var(--indigo-bg);color:var(--indigo);}
.m-day.sel{background:var(--indigo);color:#fff;font-weight:700;}
.m-slots-ttl{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin-bottom:7px;}
.m-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.m-slot{padding:7px 4px;text-align:center;border-radius:7px;border:1.5px solid var(--bdr);cursor:pointer;font-size:11px;font-weight:700;color:var(--sub);transition:all .12s;}
.m-slot.sel{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.m-slot:hover:not(.sel){border-color:var(--indigo);color:var(--indigo);}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hero{animation:fadeUp .4s ease;}
.content{animation:fadeUp .5s ease .1s both;}
</style>
</head>

  <div class="hdr-in">

} else {

}

  symEl.textContent = sm.lbl;
  if(sm.cls) symEl.classList.add(sm.cls);
  document.getElementById('heroTtl').textContent = t.name;
  document.getElementById('heroSub').textContent = t.aft;
  document.getElementById('heroMetrics').innerHTML = t.metrics.map(m =>
    `<div class="metric"><div class="metric-val">${m.v}</div><div class="metric-lbl">${m.l}</div></div>`
  ).join('');

  document.getElementById('baCol').innerHTML = `
    <div class="ba-box before">
      <div class="ba-label lb"><span class="ba-ico">📉</span>BEFORE — 今の課題</div>

/* ══════════════════════════════════════════
   MOCK UI COMPONENTS
══════════════════════════════════════════ */
function renderMock(type, d) {
  if(type==='list')  return renderList(d);
  if(type==='dash')  return renderDash(d);
  if(type==='doc')   return renderDoc(d);
  if(type==='chat')  return renderChat(d);
  if(type==='table') return renderTable(d);
  if(type==='cal')   return renderCal(d);
  return '<div style="padding:32px;text-align:center;color:#94a3b8;">プレビュー準備中</div>';
}

function renderList(d) {
  return `<div class="m-list">
    <div class="m-list-hdr">TODAY</div>
    ${d.items.map(item=>`
      <div class="m-item">
        <div class="m-ico" style="background:${item.bg}">${item.ico}</div>
        <div class="m-body">
          <div class="m-top">
            <span class="m-name">${item.name}</span>
            <span class="badge ${item.bc}">${item.badge}</span>
          </div>
          <div class="m-sub">${item.sub}</div>
          <div class="m-act">${item.act} →</div>
        </div>
      </div>`).join('')}
  </div>`;
}

function renderDash(d) {
  const mx = Math.max(...d.chart);
  const bars = d.chart.map((v,i)=>{
    const h = Math.max(4,Math.round((v/mx)*52));
    const cur = i>=d.chart.length-2;
    return `<div class="m-bar${cur?' cur':''}" style="height:${h}px"></div>`;
  }).join('');
  const mls = (d.months||[]).map(m=>`<div>${m}</div>`).join('');
  return `<div class="m-dash">
    <div class="m-kpis">${d.kpis.map(k=>`
      <div class="m-kpi">
        <div class="m-kpi-val">${k.val}</div>
        <div class="m-kpi-lbl">${k.label}</div>
        <div class="m-kpi-trend ${k.up?'t-up':'t-dn'}">${k.trend}</div>
      </div>`).join('')}
    </div>
    <div class="m-chart-lbl">推移グラフ</div>
    <div class="m-bars">${bars}</div>
    <div class="m-ml">${mls}</div>
  </div>`;
}

function renderDoc(d) {
  const secs = d.sections.map(s=>{
    const body = s.tags
      ? s.tags.map(tag=>`<span class="m-tag ${tag.t}">${tag.l}</span>`).join('')
      : `<div class="m-sec-body">${(s.body||'').replace(/\n/g,'<br>')}</div>`;
    return `<div class="m-sec"><div class="m-sec-title">${s.title}</div>${body}</div>`;
  }).join('');
  return `<div class="m-doc">
    <div class="m-doc-hdr">
      <div class="m-doc-title">📄 ${d.title}</div>
      <div class="m-doc-meta">${d.meta||''}</div>
    </div>
    ${secs}
  </div>`;
}

function renderChat(d) {
  return `<div class="m-chat">${d.messages.map(m=>`
    <div class="msg ${m.from}">
      <div class="msg-av">${m.from==='user'?'👤':'🤖'}</div>
      <div class="msg-bbl">${m.text.replace(/\n/g,'<br>')}</div>
    </div>`).join('')}
  </div>`;
}

function renderTable(d) {
  const ths = d.headers.map(h=>`<th>${h}</th>`).join('');
  const trs = d.rows.map(row=>{
    const tds = row.map(cell=>{
      const s = typeof cell==='string';
      let cls='';
      if(s&&(cell.includes('✅')||cell.includes('適合')||cell.includes('完了')||cell.includes('確定')||cell.includes('承認済')||cell.includes('済み'))) cls='st-done';
      else if(s&&(cell.includes('⚡')||cell.includes('要確認')||cell.includes('要対応')||cell.includes('承認待')||cell.includes('待ち')||cell.includes('待機'))) cls='st-pend';
      else if(s&&(cell.includes('❌')||cell.includes('非適合')||cell.includes('緊急')||cell.includes('間近')||cell.includes('閾値以下')||cell.includes('不明'))) cls='st-alert';
      return cls?`<td><span class="st ${cls}">${cell}</span></td>`:`<td>${cell}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<div class="m-tw"><table class="m-tbl"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function renderCal(d) {
  const dows = ['日','月','火','水','木','金','土'].map(w=>`<div class="m-dow">${w}</div>`).join('');
  const avails = new Set([7,8,9,13,14,15,16,20,21,22,23,27,28,29,30]);
  let days = '<div></div><div></div><div></div><div></div>'; // May 1 = Thu
  for(let n=1;n<=31;n++){
    const av=avails.has(n), sel=n===22;
    days+=`<div class="m-day${av?' av':''}${sel?' sel':''}">${n}</div>`;
  }
  const slots = (d.slots||['10:00','11:00','13:00','14:00','15:00','16:00']).map(s=>
    `<div class="m-slot${s===d.selectedSlot?' sel':''}">${s}</div>`
  ).join('');
  return `<div class="m-cal">
    <div class="m-cal-hdr">
      <div class="m-cal-month">${d.month||'2025年5月'}</div>
      <div style="display:flex;gap:4px;">
        <button class="m-cal-nav">‹</button>
        <button class="m-cal-nav">›</button>
      </div>
    </div>
    <div class="m-cg">${dows}${days}</div>
    <div class="m-slots-ttl">空き時間（${d.selectedDate||'5/22 木曜'}）</div>
    <div class="m-slots">${slots}</div>
  </div>`;
}
