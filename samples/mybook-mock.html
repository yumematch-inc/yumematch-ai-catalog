<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キーワード本棚 — モックアップ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;background:#faf8f4;color:#1a1a2e;font-size:13px;min-height:100vh;}

.hdr{height:52px;background:#1a1a2e;display:flex;align-items:center;padding:0 24px;gap:10px;position:sticky;top:0;z-index:10;}
.logo{font-size:14px;font-weight:700;color:#f5e6c8;letter-spacing:.05em;}
.logo-em{font-size:20px;}
.hdr-r{margin-left:auto;font-size:10px;color:rgba(245,230,200,.5);}

.hero{background:linear-gradient(135deg,#1a1a2e 0%,#2d2b55 100%);padding:48px 24px 40px;text-align:center;}
.hero-ttl{font-size:24px;font-weight:700;color:#f5e6c8;margin-bottom:8px;}
.hero-sub{font-size:12px;color:rgba(245,230,200,.6);margin-bottom:28px;line-height:1.7;}

.search-wrap{max-width:500px;margin:0 auto;}
.search-row{display:flex;gap:8px;}
.search-input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(245,230,200,.3);border-radius:10px;padding:12px 16px;font-size:14px;color:#f5e6c8;outline:none;font-family:inherit;}
.search-input::placeholder{color:rgba(245,230,200,.35);}
.search-input:focus{border-color:rgba(245,230,200,.6);background:rgba(255,255,255,.15);}
.search-btn{background:#f5e6c8;color:#1a1a2e;border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.search-btn:hover{background:#fff;}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.chip{font-size:11px;padding:5px 13px;border-radius:20px;border:1px solid rgba(245,230,200,.25);color:rgba(245,230,200,.7);cursor:pointer;transition:all .15s;background:transparent;}
.chip:hover{border-color:rgba(245,230,200,.6);color:#f5e6c8;}

/* Result */
.result{max-width:680px;margin:32px auto;padding:0 24px 40px;}
.result.hidden{display:none;}

.loading{text-align:center;padding:40px;color:#9c8b78;}
.loading.hidden{display:none;}
.spinner{font-size:28px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg);}}

.book-card{background:#fff;border:1px solid #e8e0d4;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(26,26,46,.07);}
.book-top{display:flex;gap:0;}
.book-spine{width:12px;flex-shrink:0;}
.book-cover{width:120px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:52px;padding:24px 0;}
.book-info{flex:1;padding:24px 20px 24px 16px;}
.book-kw{font-size:10px;font-weight:700;letter-spacing:.15em;color:#9c8b78;text-transform:uppercase;margin-bottom:6px;}
.book-title{font-size:20px;font-weight:700;color:#1a1a2e;line-height:1.3;margin-bottom:4px;}
.book-subtitle{font-size:12px;color:#6b5c4a;margin-bottom:12px;font-style:italic;}
.book-tags{display:flex;gap:6px;flex-wrap:wrap;}
.btag{font-size:10px;padding:3px 10px;border-radius:10px;background:#f5f0e8;color:#6b5c4a;}

.book-body{padding:20px 24px;border-top:1px solid #e8e0d4;}
.section-lbl{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9c8b78;margin-bottom:8px;}
.summary{font-size:13px;line-height:1.9;color:#333;margin-bottom:20px;}
.insights{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.7;color:#444;}
.insight-num{width:22px;height:22px;border-radius:50%;background:#1a1a2e;color:#f5e6c8;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.quote{background:#faf8f4;border-left:3px solid #1a1a2e;padding:12px 16px;font-size:12px;line-height:1.8;color:#555;font-style:italic;border-radius:0 8px 8px 0;}

.book-foot{padding:16px 24px;border-top:1px solid #e8e0d4;display:flex;gap:8px;justify-content:flex-end;}
.foot-btn{font-size:11px;padding:8px 16px;border-radius:8px;border:1px solid #e8e0d4;background:transparent;color:#6b5c4a;cursor:pointer;font-family:inherit;transition:all .15s;}
.foot-btn:hover{border-color:#1a1a2e;color:#1a1a2e;}
.foot-btn.primary{background:#1a1a2e;color:#f5e6c8;border-color:#1a1a2e;}
.foot-btn.primary:hover{background:#2d2b55;}
</style>
</head>
<body>

<div class="hdr">
  <span class="logo-em">📚</span>
  <span class="logo">キーワード本棚</span>
  <div class="hdr-r">気になるキーワードから、あなただけの「本」を生成</div>
</div>

<div class="hero">
  <div class="hero-ttl">気になるキーワードを入力してください</div>
  <div class="hero-sub">AIがそのキーワードにまつわる知識・洞察を<br>一冊の本のようにまとめてお届けします</div>
  <div class="search-wrap">
    <div class="search-row">
      <input class="search-input" id="kw-input" placeholder="例：習慣、生産性、起業、AI..." onkeydown="if(event.key==='Enter')generate()">
      <button class="search-btn" onclick="generate()">本を生成 →</button>
    </div>
    <div class="chips">
      <span class="chip" onclick="setKw('習慣化')">習慣化</span>
      <span class="chip" onclick="setKw('起業マインド')">起業マインド</span>
      <span class="chip" onclick="setKw('集中力')">集中力</span>
      <span class="chip" onclick="setKw('AI活用')">AI活用</span>
      <span class="chip" onclick="setKw('時間術')">時間術</span>
      <span class="chip" onclick="setKw('チームビルディング')">チームビルディング</span>
    </div>
  </div>
</div>

<div class="loading hidden" id="loading">
  <div class="spinner">⚙️</div>
  <div style="font-size:12px;color:#9c8b78;">AIが本を生成しています…</div>
</div>

<div class="result hidden" id="result"></div>

<script>
const TEMPLATES=[
  {
    em:'🔥',color:'#fef3c7',spine:'#f59e0b',
    subtitleSuffix:'を科学する',
    summary:'「{kw}」とは単なるテクニックではなく、人間の根本的な思考と行動のパターンに深く根ざした概念である。本書では、最新の認知科学と行動経済学の知見をもとに、「{kw}」を実生活で活用するための実践的なフレームワークを提示する。読者はこの本を通じて、自分の中に眠っている{kw}の力を引き出し、日常を劇的に変えるヒントを得ることができるだろう。',
    insights:[
      '{kw}の本質は「小さな一歩」の積み重ねにある。大きな変化を目指すより、1%の改善を毎日続けることが結果的に大きな差を生む。',
      '人間の脳は変化を恐れる性質がある。{kw}を習慣にするには、まず「安心できる環境設計」から始めることが鍵だ。',
      '成功者に共通するのは、{kw}を「義務」ではなく「アイデンティティ」として捉えていること。「私はそういう人間だ」という自己認識が行動を変える。',
    ],
    quote:'「{kw}は才能ではなく、設計の問題だ。正しい仕組みを作れば、誰でも同じ結果にたどり着ける。」',
    tags:['実践','科学的アプローチ','行動変容'],
  },
  {
    em:'🌱',color:'#dcfce7',spine:'#22c55e',
    subtitleSuffix:'が世界を変える理由',
    summary:'21世紀において「{kw}」はもはや一部の専門家だけのものではない。本書は、{kw}が私たちの生活・仕事・社会に与えるインパクトを多角的に分析し、これからの時代を生き抜くために個人が身につけるべきスタンスを提案する。世界中の事例と豊富なデータをもとに、{kw}の本質に迫る一冊。',
    insights:[
      '{kw}の波は、すでに私たちの日常の隅々まで届いている。気づいていないだけで、多くの人がすでにその恩恵を受けている。',
      '未来の競争優位は「{kw}を使いこなせるか否か」で決まる。早期に経験を積んだ人間が圧倒的なアドバンテージを持つ。',
      '{kw}の最大の価値は効率化ではなく、「人間にしかできないこと」に集中できるようになることだ。',
    ],
    quote:'「{kw}を恐れるより、{kw}と共に成長することを選んだ者が次の時代をリードする。」',
    tags:['トレンド','未来予測','社会変化'],
  },
  {
    em:'💡',color:'#ede9fe',spine:'#8b5cf6',
    subtitleSuffix:'の新常識',
    summary:'多くの人が「{kw}」について漠然とした理解しか持っていない。本書はその誤解を一つひとつ解きほぐし、本当に使える知識として再構築する試みだ。著者は15年以上にわたる研究と実践を通じて、{kw}に関する「常識」の多くが実は思い込みに過ぎないことを明らかにしてきた。',
    insights:[
      '「{kw}には才能が必要」という思い込みは、科学的に否定されている。正しい方法論を持てば、誰でも習得できる。',
      '{kw}における最大の敵は「完璧主義」だ。まず動き、修正を繰り返す姿勢が長期的な成果につながる。',
      '成果を出す人は{kw}を「孤独な作業」と捉えない。周囲を巻き込み、仕組みの中に組み込む視点が違う。',
    ],
    quote:'「{kw}について知っていることの9割は、実は間違った前提の上に成り立っている。」',
    tags:['思考法','逆張り','実証'],
  },
];

function setKw(kw){
  document.getElementById('kw-input').value=kw;
  generate();
}

function generate(){
  const kw=document.getElementById('kw-input').value.trim();
  if(!kw)return;

  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');

  setTimeout(()=>{
    document.getElementById('loading').classList.add('hidden');
    renderBook(kw);
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
  },1400);
}

function renderBook(kw){
  const t=TEMPLATES[Math.floor(Math.random()*TEMPLATES.length)];
  const fill=s=>s.replace(/\{kw\}/g,kw);
  const title=`${kw}の力`;

  document.getElementById('result').innerHTML=`
    <div class="book-card">
      <div class="book-top">
        <div class="book-spine" style="background:${t.spine}"></div>
        <div class="book-cover" style="background:${t.color}">${t.em}</div>
        <div class="book-info">
          <div class="book-kw">Keyword: ${kw}</div>
          <div class="book-title">${title}</div>
          <div class="book-subtitle">${kw}${t.subtitleSuffix}</div>
          <div class="book-tags">${t.tags.map(g=>`<span class="btag">${g}</span>`).join('')}</div>
        </div>
      </div>
      <div class="book-body">
        <div class="section-lbl">概要</div>
        <div class="summary">${fill(t.summary)}</div>
        <div class="section-lbl">3つの洞察</div>
        <ul class="insights">
          ${t.insights.map((ins,i)=>`
            <li class="insight">
              <span class="insight-num">${i+1}</span>
              <span>${fill(ins)}</span>
            </li>
          `).join('')}
        </ul>
        <div class="section-lbl">印象的な一節</div>
        <div class="quote">${fill(t.quote)}</div>
      </div>
      <div class="book-foot">
        <button class="foot-btn" onclick="generate()">別パターンを生成</button>
        <button class="foot-btn primary" onclick="alert('本番では保存・共有機能が使えます')">本棚に保存</button>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
