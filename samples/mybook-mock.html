<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分専用本棚 — モックアップ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;background:#faf8f4;color:#1a1a2e;font-size:13px;min-height:100vh;}

.hdr{height:52px;background:#1a1a2e;display:flex;align-items:center;padding:0 24px;gap:10px;position:sticky;top:0;z-index:10;}
.logo{font-size:14px;font-weight:700;color:#f5e6c8;letter-spacing:.05em;}
.logo-em{font-size:20px;}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;}
.badge{font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid rgba(245,230,200,.3);color:#f5e6c8;opacity:.7;}

.hero{background:linear-gradient(135deg,#1a1a2e 0%,#2d2b55 100%);padding:48px 24px 36px;text-align:center;}
.hero-ttl{font-size:28px;font-weight:700;color:#f5e6c8;letter-spacing:.02em;margin-bottom:8px;}
.hero-sub{font-size:13px;color:rgba(245,230,200,.6);margin-bottom:24px;}
.stats{display:inline-flex;gap:32px;background:rgba(255,255,255,.06);border:1px solid rgba(245,230,200,.15);border-radius:12px;padding:14px 28px;}
.st{text-align:center;}
.st-n{font-size:22px;font-weight:700;color:#f5e6c8;}
.st-l{font-size:10px;color:rgba(245,230,200,.5);margin-top:2px;}

.filters{padding:20px 24px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e8e0d4;}
.ftag{font-size:11px;padding:5px 14px;border-radius:20px;border:1px solid #d4c9b8;background:transparent;color:#6b5c4a;cursor:pointer;font-family:inherit;transition:all .15s;}
.ftag.on{background:#1a1a2e;color:#f5e6c8;border-color:#1a1a2e;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding:24px;}
.book{background:#fff;border:1px solid #e8e0d4;border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;}
.book:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(26,26,46,.1);}
.book-cover{height:140px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
.book-status{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;}
.read{background:#dcfce7;color:#166534;}
.reading{background:#fef9c3;color:#854d0e;}
.want{background:#ede9fe;color:#5b21b6;}
.book-body{padding:12px;flex:1;display:flex;flex-direction:column;}
.book-title{font-size:12px;font-weight:700;color:#1a1a2e;margin-bottom:4px;line-height:1.4;}
.book-author{font-size:10px;color:#9c8b78;margin-bottom:8px;}
.book-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;}
.btag{font-size:9px;padding:2px 7px;border-radius:8px;background:#f5f0e8;color:#6b5c4a;}
.book-rating{font-size:11px;color:#f59e0b;margin-top:6px;}
</style>
</head>
<body>

<div class="hdr">
  <span class="logo-em">📚</span>
  <span class="logo">自分専用本棚</span>
  <div class="hdr-r">
    <span class="badge">Notion 連携中</span>
    <span class="badge">自動更新</span>
  </div>
</div>

<div class="hero">
  <div class="hero-ttl">My Bookshelf</div>
  <div class="hero-sub">Notionで管理した本が自動でここに反映されます</div>
  <div class="stats">
    <div class="st"><div class="st-n">24</div><div class="st-l">読了</div></div>
    <div class="st"><div class="st-n">3</div><div class="st-l">読書中</div></div>
    <div class="st"><div class="st-n">12</div><div class="st-l">積読</div></div>
  </div>
</div>

<div class="filters">
  <button class="ftag on" onclick="filter(this,'all')">すべて</button>
  <button class="ftag" onclick="filter(this,'biz')">ビジネス</button>
  <button class="ftag" onclick="filter(this,'tech')">テック・AI</button>
  <button class="ftag" onclick="filter(this,'self')">自己啓発</button>
  <button class="ftag" onclick="filter(this,'life')">ライフ</button>
  <button class="ftag" onclick="filter(this,'novel')">小説</button>
</div>

<div class="grid" id="grid"></div>

<script>
const BOOKS=[
  {title:'ゼロ・トゥ・ワン',author:'ピーター・ティール',em:'🚀',status:'read',rating:5,tags:['biz','スタートアップ']},
  {title:'AIとの共存',author:'カイ＝フー・リー',em:'🤖',status:'read',rating:4,tags:['tech','AI']},
  {title:'嫌われる勇気',author:'岸見一郎',em:'💡',status:'read',rating:5,tags:['self','哲学']},
  {title:'ファクトフルネス',author:'ハンス・ロスリング',em:'📊',status:'read',rating:5,tags:['biz','データ']},
  {title:'Deep Work',author:'カル・ニューポート',em:'🧘',status:'reading',rating:null,tags:['self','集中力']},
  {title:'サピエンス全史',author:'ユヴァル・ノア・ハラリ',em:'🌍',status:'read',rating:4,tags:['life','歴史']},
  {title:'Learn or Die',author:'伊賀泰代',em:'📈',status:'want',rating:null,tags:['biz','組織']},
  {title:'夜と霧',author:'ヴィクトール・フランクル',em:'🌙',status:'read',rating:5,tags:['novel','哲学']},
  {title:'シンギュラリティは近い',author:'レイ・カーツワイル',em:'🔮',status:'want',rating:null,tags:['tech','未来']},
  {title:'アトミック・ハビット',author:'ジェームズ・クリア',em:'⚛️',status:'reading',rating:null,tags:['self','習慣']},
  {title:'起業の科学',author:'田所雅之',em:'🔬',status:'read',rating:4,tags:['biz','起業']},
  {title:'限りある時間の使い方',author:'オリバー・バークマン',em:'⏳',status:'want',rating:null,tags:['life','時間術']},
];

const SL={'read':'読了','reading':'読書中','want':'積読'};

function renderBooks(list){
  document.getElementById('grid').innerHTML=list.map(b=>`
    <div class="book">
      <div class="book-cover" style="background:${colorFor(b.tags[0])}">
        ${b.em}
        <span class="book-status ${b.status}">${SL[b.status]}</span>
      </div>
      <div class="book-body">
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author}</div>
        ${b.rating?`<div class="book-rating">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</div>`:''}
        <div class="book-tags">${b.tags.map(t=>`<span class="btag">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function colorFor(tag){
  const m={biz:'#fef3c7',tech:'#e0f2fe',self:'#f3e8ff',life:'#dcfce7',novel:'#fce7f3'};
  return m[tag]||'#f5f0e8';
}

function filter(el,cat){
  document.querySelectorAll('.ftag').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  const list=cat==='all'?BOOKS:BOOKS.filter(b=>b.tags.includes(cat));
  renderBooks(list);
}

renderBooks(BOOKS);
</script>
</body>
</html>
