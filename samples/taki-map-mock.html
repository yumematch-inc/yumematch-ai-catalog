<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滝マップ — モックアップ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Noto Sans JP',-apple-system,sans-serif;background:#0f1923;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Header */
.hdr{height:52px;background:#111827;border-bottom:1px solid #1e293b;display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:10;}
.logo{font-size:13px;font-weight:700;color:#38bdf8;letter-spacing:.05em;}
.logo-icon{font-size:18px;}
.hdr-sub{font-size:11px;color:#475569;}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid #1e3a5f;color:#38bdf8;background:rgba(56,189,248,.08);}

/* Layout */
.body{display:flex;flex:1;overflow:hidden;}

/* Sidebar */
.side{width:280px;background:#111827;border-right:1px solid #1e293b;display:flex;flex-direction:column;flex-shrink:0;}
.side-hd{padding:16px 16px 12px;border-bottom:1px solid #1e293b;}
.side-hd h2{font-size:12px;font-weight:700;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.search{width:100%;background:#0f1923;border:1px solid #1e293b;border-radius:7px;padding:7px 12px;font-size:12px;color:#e2e8f0;outline:none;font-family:inherit;}
.search::placeholder{color:#334155;}
.filter-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.ftag{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid #1e293b;color:#64748b;background:transparent;cursor:pointer;font-family:inherit;transition:all .15s;}
.ftag.on{border-color:#38bdf8;color:#38bdf8;background:rgba(56,189,248,.08);}

.list{flex:1;overflow-y:auto;padding:8px;}
.list::-webkit-scrollbar{width:4px;}
.list::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px;}

.card{padding:12px;border-radius:8px;border:1px solid #1e293b;background:#0f1923;margin-bottom:6px;cursor:pointer;transition:all .15s;}
.card:hover,.card.sel{border-color:#38bdf8;background:rgba(56,189,248,.05);}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.card-em{font-size:18px;}
.card-name{font-size:12px;font-weight:600;color:#e2e8f0;}
.card-area{font-size:10px;color:#475569;}
.card-desc{font-size:11px;color:#64748b;line-height:1.55;}
.card-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.ctag{font-size:9px;padding:2px 7px;border-radius:10px;background:#1e293b;color:#64748b;}

/* Map area */
.map-wrap{flex:1;position:relative;overflow:hidden;}
.map-bg{width:100%;height:100%;background:
  radial-gradient(ellipse at 30% 40%, rgba(30,58,138,.3) 0%, transparent 50%),
  radial-gradient(ellipse at 70% 60%, rgba(5,150,105,.15) 0%, transparent 40%),
  linear-gradient(180deg,#0f1923 0%,#0a1628 100%);}

/* Map decorations */
.terrain{position:absolute;inset:0;}
.contour{position:absolute;border-radius:50%;border:1px solid rgba(56,189,248,.06);}

/* Pins */
.pin{position:absolute;cursor:pointer;transform:translate(-50%,-100%);transition:transform .2s;}
.pin:hover,.pin.active{transform:translate(-50%,-100%) scale(1.2);}
.pin-dot{width:32px;height:32px;border-radius:50%;background:#38bdf8;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 0 4px rgba(56,189,248,.2),0 4px 12px rgba(0,0,0,.4);}
.pin-dot.live{background:#38bdf8;}
.pin-dot.wip{background:#475569;}
.pin-label{position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid #1e293b;border-radius:5px;padding:2px 8px;font-size:10px;white-space:nowrap;color:#94a3b8;pointer-events:none;}

/* Popup */
.popup{position:absolute;width:220px;background:#111827;border:1px solid #1e3a5f;border-radius:10px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:5;display:none;}
.popup.show{display:block;}
.pop-em{font-size:24px;margin-bottom:6px;}
.pop-name{font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px;}
.pop-area{font-size:10px;color:#475569;margin-bottom:8px;}
.pop-info{font-size:11px;color:#64748b;line-height:1.6;margin-bottom:10px;}
.pop-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
.pop-btn{display:block;text-align:center;background:#1e3a5f;color:#38bdf8;border:1px solid #1e5f8f;border-radius:6px;padding:6px;font-size:11px;text-decoration:none;font-family:inherit;cursor:pointer;}
.pop-close{position:absolute;top:8px;right:10px;background:none;border:none;color:#475569;cursor:pointer;font-size:14px;}

/* Scale bar */
.scale{position:absolute;bottom:16px;left:296px;background:rgba(17,24,39,.8);border:1px solid #1e293b;border-radius:6px;padding:6px 10px;font-size:10px;color:#475569;}

/* Legend */
.legend{position:absolute;bottom:16px;right:16px;background:rgba(17,24,39,.9);border:1px solid #1e293b;border-radius:8px;padding:10px 12px;}
.leg-ttl{font-size:9px;font-weight:700;color:#475569;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.leg-row{display:flex;align-items:center;gap:6px;font-size:10px;color:#64748b;margin-bottom:3px;}
.leg-dot{width:10px;height:10px;border-radius:50%;}

/* Count bar */
.count-bar{position:absolute;top:12px;left:296px;background:rgba(17,24,39,.9);border:1px solid #1e293b;border-radius:8px;padding:8px 14px;display:flex;gap:16px;}
.ct{text-align:center;}
.ct-num{font-size:16px;font-weight:700;color:#38bdf8;}
.ct-lbl{font-size:9px;color:#475569;margin-top:1px;}
</style>
</head>
<body>

<div class="hdr">
  <span class="logo-icon">🗺</span>
  <span class="logo">滝マップ</span>
  <span class="hdr-sub">長野・東海エリアの滝を探す</span>
  <div class="hdr-r">
    <span class="badge">🔵 LIVE</span>
    <span class="badge">Notion 同期中</span>
  </div>
</div>

<div class="body">
  <!-- Sidebar -->
  <div class="side">
    <div class="side-hd">
      <h2>絞り込み</h2>
      <input class="search" placeholder="滝の名前を検索…" oninput="filterCards(this.value)">
      <div class="filter-row">
        <button class="ftag on" onclick="toggleFilter(this,'all')">すべて</button>
        <button class="ftag" onclick="toggleFilter(this,'nagano')">長野</button>
        <button class="ftag" onclick="toggleFilter(this,'aichi')">愛知</button>
        <button class="ftag" onclick="toggleFilter(this,'gifu')">岐阜</button>
      </div>
    </div>
    <div class="list" id="card-list"></div>
  </div>

  <!-- Map -->
  <div class="map-wrap" id="map" onclick="closePopup()">
    <div class="map-bg">
      <!-- Terrain decorations -->
      <div class="terrain">
        <div class="contour" style="width:600px;height:400px;top:10%;left:20%;"></div>
        <div class="contour" style="width:400px;height:300px;top:25%;left:30%;"></div>
        <div class="contour" style="width:200px;height:160px;top:38%;left:42%;"></div>
        <div class="contour" style="width:700px;height:500px;top:30%;right:-5%;"></div>
        <div class="contour" style="width:350px;height:280px;bottom:10%;left:5%;"></div>
      </div>
    </div>

    <!-- Pins (positioned absolutely over map) -->
    <div id="pins"></div>

    <!-- Popup -->
    <div class="popup" id="popup" onclick="event.stopPropagation()">
      <button class="pop-close" onclick="closePopup()">✕</button>
      <div id="pop-content"></div>
    </div>

    <!-- Count bar -->
    <div class="count-bar">
      <div class="ct"><div class="ct-num" id="total-count">8</div><div class="ct-lbl">登録数</div></div>
      <div class="ct"><div class="ct-num" style="color:#38bdf8" id="live-count">5</div><div class="ct-lbl">公開中</div></div>
      <div class="ct"><div class="ct-num" style="color:#475569" id="wip-count">3</div><div class="ct-lbl">調査中</div></div>
    </div>

    <!-- Scale -->
    <div class="scale">←——— 約 50km ———→</div>

    <!-- Legend -->
    <div class="legend">
      <div class="leg-ttl">凡例</div>
      <div class="leg-row"><div class="leg-dot" style="background:#38bdf8"></div>公開中</div>
      <div class="leg-row"><div class="leg-dot" style="background:#475569"></div>調査中</div>
    </div>
  </div>
</div>

<script>
const FALLS=[
  {id:1,name:'番所大滝',emoji:'💧',area:'長野県 乗鞍',pref:'nagano',
   pos:{x:38,y:32},status:'live',
   h:'高さ 40m',type:'直瀑',
   desc:'乗鞍高原に位置する落差40mの豪快な滝。新緑・紅葉シーズンが特に美しい。',
   tags:['乗鞍','紅葉','駐車場あり']},
  {id:2,name:'善五郎の滝',emoji:'💧',area:'長野県 乗鞍',pref:'nagano',
   pos:{x:41,y:36},status:'live',
   h:'高さ 21m',type:'直瀑',
   desc:'3段に流れ落ちる優美な滝。乗鞍高原の自然研究路沿いにある。',
   tags:['乗鞍','ハイキング','アクセス良好']},
  {id:3,name:'三本滝',emoji:'💧',area:'長野県 乗鞍',pref:'nagano',
   pos:{x:35,y:28},status:'live',
   h:'高さ 30m',type:'分岐瀑',
   desc:'3本の沢が合流する珍しい滝。日本の滝100選に選定。',
   tags:['乗鞍','日本100選','上級者向け']},
  {id:4,name:'阿寺の七滝',emoji:'💧',area:'愛知県 新城',pref:'aichi',
   pos:{x:55,y:55},status:'live',
   h:'高さ 10m',type:'段瀑',
   desc:'7段に連なる個性的な滝群。周辺は阿寺渓谷として整備されている。',
   tags:['新城','渓谷','家族向け']},
  {id:5,name:'蛇淵の滝',emoji:'💧',area:'岐阜県 郡上',pref:'gifu',
   pos:{x:48,y:62},status:'live',
   h:'高さ 15m',type:'直瀑',
   desc:'郡上市の秘境に佇む落差15mの滝。透明度の高い淵が美しい。',
   tags:['郡上','秘境','夏向き']},
  {id:6,name:'阿弥陀ヶ滝',emoji:'💧',area:'岐阜県 郡上',pref:'gifu',
   pos:{x:44,y:58},status:'wip',
   h:'高さ 60m',type:'直瀑',
   desc:'落差60mの迫力ある直瀑。日本の滝100選。現在詳細情報を調査中。',
   tags:['郡上','日本100選','調査中']},
  {id:7,name:'平湯大滝',emoji:'💧',area:'岐阜県 奥飛騨',pref:'gifu',
   pos:{x:36,y:44},status:'wip',
   h:'高さ 64m',type:'直瀑',
   desc:'奥飛騨温泉郷近くの名瀑。冬季には氷結した氷瀑が見られる。調査中。',
   tags:['奥飛騨','氷瀑','温泉']},
  {id:8,name:'田立の滝',emoji:'💧',area:'長野県 南木曽',pref:'nagano',
   pos:{x:52,y:48},status:'wip',
   h:'高さ 25m',type:'段瀑',
   desc:'南木曽町に連なる滝群。原生林に包まれた神秘的な空間。データ整備中。',
   tags:['南木曽','原生林','中級者向け']},
];

let selected=null;
let activeFilter='all';

function renderCards(falls){
  document.getElementById('card-list').innerHTML=falls.map(f=>`
    <div class="card${selected===f.id?' sel':''}" id="card-${f.id}" onclick="selectFall(${f.id},event)">
      <div class="card-top">
        <span class="card-em">${f.emoji}</span>
        <div>
          <div class="card-name">${f.name}</div>
          <div class="card-area">${f.area} / ${f.h}</div>
        </div>
      </div>
      <div class="card-desc">${f.desc.slice(0,42)}…</div>
      <div class="card-tags">${f.tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderPins(falls){
  document.getElementById('pins').innerHTML=falls.map(f=>`
    <div class="pin${selected===f.id?' active':''}" id="pin-${f.id}"
         style="left:${f.pos.x}%;top:${f.pos.y}%"
         onclick="event.stopPropagation();selectFall(${f.id},event)">
      <div class="pin-label">${f.name}</div>
      <div class="pin-dot ${f.status}">${f.emoji}</div>
    </div>
  `).join('');
}

function selectFall(id, e){
  selected=id;
  const f=FALLS.find(x=>x.id===id);
  const pin=document.getElementById('pin-'+id);
  const popup=document.getElementById('popup');

  document.getElementById('pop-content').innerHTML=`
    <div class="pop-em">${f.emoji}</div>
    <div class="pop-name">${f.name}</div>
    <div class="pop-area">${f.area} ／ ${f.h} ／ ${f.type}</div>
    <div class="pop-info">${f.desc}</div>
    <div class="pop-tags">${f.tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>
    <button class="pop-btn" onclick="alert('本番では詳細ページへ遷移します')">詳細を見る →</button>
  `;

  const px=f.pos.x;
  const py=f.pos.y;
  popup.style.left=(px>60?'auto':(px+'%'));
  popup.style.right=(px>60?'5%':'auto');
  popup.style.top=(py>55?(py-35)+'%':(py+5)+'%');
  popup.classList.add('show');

  rerender();
}

function closePopup(){
  selected=null;
  document.getElementById('popup').classList.remove('show');
  rerender();
}

function toggleFilter(el,pref){
  document.querySelectorAll('.ftag').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  activeFilter=pref;
  rerender();
}

function filterCards(q){
  const filtered=FALLS.filter(f=>{
    const matchPref=activeFilter==='all'||f.pref===activeFilter;
    const matchQ=!q||f.name.includes(q)||f.area.includes(q)||f.tags.some(t=>t.includes(q));
    return matchPref&&matchQ;
  });
  renderCards(filtered);
  renderPins(filtered);
  updateCounts(filtered);
}

function rerender(){
  const q=document.querySelector('.search').value;
  filterCards(q);
}

function updateCounts(falls){
  document.getElementById('total-count').textContent=falls.length;
  document.getElementById('live-count').textContent=falls.filter(f=>f.status==='live').length;
  document.getElementById('wip-count').textContent=falls.filter(f=>f.status==='wip').length;
}

renderCards(FALLS);
renderPins(FALLS);
</script>
</body>
</html>
